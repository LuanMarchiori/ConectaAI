<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conecta.ai — Contratos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div><span class="brand-name">Conecta<span style="font-style:normal;">.ai</span></span><span class="brand-sub">PAINEL DA MEI</span></div>
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">☰</button>
    </div>
    <nav class="tabs" id="tabsNav">
      <a class="tab" href="index.html"><span class="glyph">·</span> Visão geral</a>
      <a class="tab" href="clientes.html"><span class="glyph">01</span> Clientes</a>
      <a class="tab active" href="contratos.html"><span class="glyph">02</span> Contratos</a>
      <a class="tab" href="prazos.html"><span class="glyph">03</span> Prazos</a>
      <a class="tab" href="gastos.html"><span class="glyph">04</span> Gastos</a>
    </nav>
  </aside>

  <main>
    <div id="erro"></div>

    <div class="section-head">
      <div><h1>Contratos</h1><p>Consulte os contratos de um cliente ou registre um novo, com valor, prazos e link da minuta.</p></div>
    </div>

    <div class="panel">
      <div class="row2" style="align-items:flex-end;">
        <div class="field"><label for="filtroCliente">Ver contratos do cliente</label>
          <select id="filtroCliente"><option value="">Todos os clientes</option></select>
        </div>
      </div>
      <div id="listaContratos"></div>
    </div>

    <div class="panel">
      <h2>Novo contrato</h2>
      <p class="hint" id="semClientes" hidden>Cadastre um cliente antes de criar contratos.</p>
      <form id="formContrato">
        <div class="field"><label>Cliente</label><select name="cliente_id" id="selCliente" required></select></div>
        <div class="field"><label>Título</label><input name="titulo" required placeholder="Ex.: Sistema de agendamento"></div>
        <div class="field"><label>Descrição <span class="opt">(opcional)</span></label><textarea name="descricao" placeholder="Escopo do serviço"></textarea></div>
        <div class="row2">
          <div class="field"><label>Valor total (R$)</label><input name="valor_total" type="number" step="0.01" min="0" required placeholder="0,00"></div>
          <div class="field"><label>Link da minuta <span class="opt">(opcional)</span></label><input name="link_minuta" type="url" placeholder="https://…"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Data de início <span class="opt">(opcional)</span></label><input name="data_inicio" type="date"></div>
          <div class="field"><label>Data de término <span class="opt">(opcional)</span></label><input name="data_termino" type="date"></div>
        </div>
        <button class="btn" type="submit">Salvar contrato</button>
      </form>
    </div>
    <div class="footer-note">CONECTA.AI · PAINEL DA MICROEMPRESA</div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/common.js"></script>
<script src="js/contratos.js"></script>
</body>
</html>
